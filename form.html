<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran Akun</title>
</head>

<body>

<nav>
    <a href="index.html">IMDb</a> |
    <a href="blog.html">Dev Blogs</a> |
    <a href="form.html">Daftar Akun</a> |
    <a href="cv.html">CV</a>
</nav>

<hr>

<form>

<fieldset>

<legend>Daftar Akun</legend>

<p>
    Nama Lengkap:
    <input type="text" name="nama_lengkap">
</p>

<hr>

<p>
    Jenis Kelamin:

    <input type="radio"
           name="jenis_kelamin"
           value="laki-laki">
    Laki-Laki

    <input type="radio"
           name="jenis_kelamin"
           value="perempuan">
    Perempuan
</p>

<hr>

<p>
    Tempat Lahir:
    <input type="text" name="tempat_lahir">
</p>

<hr>

<p>
    Tanggal Lahir:
    <input type="date" name="tanggal_lahir">
</p>

<hr>

<p>
    Agama:

    <select name="agama">
        <option>--- Pilih Agama ---</option>
        <option>Islam</option>
        <option>Katolik</option>
        <option>Protestan</option>
        <option>Hindu</option>
        <option>Buddha</option>
        <option>Konghucu</option>
    </select>
</p>

<hr>

<p>
    Hobi:

    <input type="checkbox"
           name="hobi"
           value="olahraga">
    Olahraga

    <input type="checkbox"
           name="hobi"
           value="membaca">
    Membaca

    <input type="checkbox"
           name="hobi"
           value="ngoding">
    Ngoding
</p>

<hr>

<p>
    Password:
    <input type="password" name="password">
</p>

<hr>

<p>
    <input type="checkbox" name="persetujuan">

    Dengan mendaftar saya setuju dengan Ketentuan
    dan Kebijakan Privasi Aplikasi.
</p>

<input type="reset" value="Reset">

<input type="submit" value="Submit">

</fieldset>

</form>

</body>
</html>
